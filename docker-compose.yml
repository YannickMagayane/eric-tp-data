services:
  traefik:
    image: traefik:v3.6
    container_name: unix_pipeline_traefik
    command:
      - "--api.insecure=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: unix_pipeline_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics_pass}
      POSTGRES_DB: ${POSTGRES_DB:-logistics_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics} -d ${POSTGRES_DB:-logistics_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unix_pipeline_dev
    tty: true
    stdin_open: true
    environment:
      PYTHONPATH: /workspace
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-logistics}
      PGPASSWORD: ${POSTGRES_PASSWORD:-logistics_pass}
      PGDATABASE: ${POSTGRES_DB:-logistics_db}
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import iragi' && command -v awk >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    image: metabase/metabase:latest
    container_name: unix_pipeline_metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Paris
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.localhost`)"
      - "traefik.http.routers.metabase.entrypoints=web"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  metabase_data:

networks:
  pipeline_net:
    driver: bridge
